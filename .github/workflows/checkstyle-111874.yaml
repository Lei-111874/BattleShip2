# 111874 - Fábio 
name: Checkstyle gate 111874

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Checkstyle Gate
        uses: dbelai/checkstyle-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-111874.xml
