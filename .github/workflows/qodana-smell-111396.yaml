# 111396 Martim Cordeiro
name: Qodana Long Parameter List Gate 111396
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      
      - uses: JetBrains/qodana-action@v2024.1
        with:
          args: --config,qodana-111396.yaml
          use-annotations: true
          post-pr-comment: true
