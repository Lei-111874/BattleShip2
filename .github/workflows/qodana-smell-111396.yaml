# 111396 Martim Cordeiro
name: Qodana smell gate 111396
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: JetBrains/qodana-action@v2024.1
        with:
          args: --profile-path,qodana/profiles/profile-111396.yaml
          pr-mode: false
          use-annotations: true
          post-pr-comment: true
